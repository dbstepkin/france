<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Что для вас Франция?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="host">
    <section class="collect" id="collect" hidden>
      <div>
        <div class="flag"><i></i><i></i><i></i></div>
        <h1>Что для вас Франция?</h1>
        <div class="lead">Наведите камеру телефона на QR-код и напишите три слова, которые первыми приходят в голову.</div>
        <div class="counter"><b id="count">0</b><span id="countLabel">ответов</span></div>
        <button id="finishBtn">Завершить опрос</button>
        <div class="err" id="err"></div>
      </div>
      <div class="qrbox">
        <div class="qr" id="qr"></div>
        <div class="url" id="url"></div>
      </div>
    </section>

    <section class="loading" id="loading" hidden>
      <div>
        <div class="spinner"></div>
        <p>Собираем облако…</p>
      </div>
    </section>

    <section class="result" id="result" hidden>
      <header>
        <h1>Что для вас Франция?</h1>
        <div class="meta">
          <span id="resMeta"></span>
          <button class="ghost" id="resetBtn">Новый опрос</button>
        </div>
      </header>
      <div class="stage" id="stage"></div>
    </section>
  </div>

  <script src="/qrcode.js"></script>
  <script src="/cloud.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const voteUrl = location.origin + '/vote';
    let cloud = null;
    let mode = '';

    function plural(n, one, few, many) {
      const m10 = n % 10, m100 = n % 100;
      if (m10 === 1 && m100 !== 11) return one;
      if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
      return many;
    }

    function show(next) {
      if (mode === next) return;
      mode = next;
      for (const id of ['collect', 'loading', 'result']) $(id).hidden = id !== next;
    }

    (function drawQR() {
      const qr = qrcode(0, 'M');
      qr.addData(voteUrl);
      qr.make();
      $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      $('url').innerHTML = '<b>' + location.host + '</b>/vote';
    })();

    function showCloud(c) {
      cloud = c;
      show('result');
      $('resMeta').textContent = c.participants + ' ' + plural(c.participants, 'участник', 'участника', 'участников');
      renderCloud($('stage'), cloud);
    }

    async function poll() {
      try {
        const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
        if (s.finished) {
          if (!cloud || cloud.at !== s.cloud.at) showCloud(s.cloud);
        } else if (mode !== 'loading') {
          cloud = null;
          show('collect');
          $('count').textContent = s.count;
          $('countLabel').textContent = plural(s.count, 'ответ', 'ответа', 'ответов');
        }
      } catch {}
    }

    $('finishBtn').onclick = async () => {
      $('err').textContent = '';
      show('loading');
      try {
        const r = await fetch('/api/finish', { method: 'POST' });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Ошибка');
        showCloud(j.cloud);
      } catch (e) {
        show('collect');
        $('err').textContent = e.message;
      }
    };

    $('resetBtn').onclick = async () => {
      if (!confirm('Начать новый опрос? Текущие ответы будут удалены.')) return;
      await fetch('/api/reset', { method: 'POST' });
      cloud = null;
      mode = '';
      poll();
    };

    let rt;
    addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => cloud && mode === 'result' && renderCloud($('stage'), cloud), 150);
    });

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
